# Triggered observable one-shot; qualified candidate removes this file.
name: Observable detached pre-MS ExtFS qualification

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write

jobs:
  portable:
    if: github.event.head_commit.message == 'Trigger observable pre-MS qualification'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      source_sha: ${{ steps.detached.outputs.source_sha }}
      base_sha: ${{ steps.detached.outputs.base_sha }}
      patch_sha256: ${{ steps.detached.outputs.patch_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Apply audited source transformation
        id: transform
        shell: bash
        run: |
          set -o pipefail
          python3 tools/apply-pre-ms-hardening.py 2>&1 | tee "$RUNNER_TEMP/extfs-transform.log"
      - name: Update permanent qualification and support documentation
        id: docs
        shell: python
        run: |
          from pathlib import Path
          p=Path('.github/workflows/windows-wdk-ci.yml'); t=p.read_text(); needle='      - name: Locate NuGet\n'
          check="      - name: Verify filesystem contracts\n        shell: powershell\n        run: .\\windows\\test\\Test-FilesystemContracts.ps1\n\n"
          if check not in t:
              if needle not in t: raise SystemExit('Windows WDK CI insertion point missing')
              p.write_text(t.replace(needle,check+needle,1))
          p=Path('docs/FEATURE_SUPPORT.md'); t=p.read_text()
          old='| Volume lock/unlock | Refused | Exclusive lock ownership/enforcement not implemented |'
          new='| Volume lock/unlock | Implemented | Direct volume handle only; lock succeeds only when no ordinary opens or mapped-section FCBs remain; ownership follows the issuing FILE_OBJECT and releases on unlock/cleanup |'
          if old in t: t=t.replace(old,new,1)
          if 'Locked-volume dismount' not in t: t+='\n| Locked-volume dismount | Implemented bounded path | `FSCTL_DISMOUNT_VOLUME` requires the issuing handle to own an ExtFS volume lock; unlocked forced-dismount teardown remains deferred |\n'
          if 'Unrepresentable raw ext names' not in t: t+='| Unrepresentable raw ext names | Explicit failure | ext permits arbitrary non-NUL name bytes; Windows enumeration surfaces a name-conversion error rather than silently hiding a live entry |\n'
          p.write_text(t)
      - name: Portable real-image contract and cross-build qualification
        id: qualify
        shell: bash
        run: |
          set -o pipefail
          {
            sudo apt-get update
            sudo apt-get install -y e2fsprogs make gcc gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64
            make clean && make
            ./build/test-extfs
            make integration
            pwsh -NoLogo -NoProfile -File windows/test/Test-FilesystemContracts.ps1
            ./windows/build-cross-linux.sh
            git diff --check
          } 2>&1 | tee "$RUNNER_TEMP/extfs-qualification.log"
      - name: Build exact detached candidate and patch
        id: detached
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git rm -f tools/apply-pre-ms-hardening.py .github/workflows/pre-ms-hardening.yml .github/workflows/run-pre-ms-hardening.yml .github/workflows/run-pre-ms-push.yml .github/workflows/run-pre-ms-push-v2.yml
          mkdir -p "$RUNNER_TEMP/extfs-qualified"
          git diff --binary HEAD > "$RUNNER_TEMP/extfs-qualified/qualified.patch"
          export PATCH_SHA256=$(sha256sum "$RUNNER_TEMP/extfs-qualified/qualified.patch" | awk '{print $1}')
          python3 - <<'PY'
          import base64,json,os,pathlib,subprocess,urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GITHUB_TOKEN']; base=os.environ['GITHUB_SHA']; api=f'https://api.github.com/repos/{repo}'
          def req(method,path,payload=None):
              data=None if payload is None else json.dumps(payload).encode(); r=urllib.request.Request(api+path,data=data,method=method)
              r.add_header('Authorization',f'Bearer {token}'); r.add_header('Accept','application/vnd.github+json'); r.add_header('X-GitHub-Api-Version','2022-11-28')
              with urllib.request.urlopen(r) as h:return json.load(h)
          bc=req('GET',f'/git/commits/{base}'); entries=[]; fields=subprocess.check_output(['git','diff','--name-status','-z','HEAD']).decode().split('\0'); i=0
          while i<len(fields) and fields[i]:
              status=fields[i]; i+=1; path=fields[i]; i+=1
              if status.startswith(('R','C')): path=fields[i]; i+=1
              if status.startswith('D'): entries.append({'path':path,'mode':'100644','type':'blob','sha':None}); continue
              blob=req('POST','/git/blobs',{'content':base64.b64encode(pathlib.Path(path).read_bytes()).decode(),'encoding':'base64'})
              ls=subprocess.check_output(['git','ls-files','-s','--',path]).decode().split(); mode=ls[0] if ls else '100644'
              entries.append({'path':path,'mode':mode,'type':'blob','sha':blob['sha']})
          tree=req('POST','/git/trees',{'base_tree':bc['tree']['sha'],'tree':entries}); commit=req('POST','/git/commits',{'message':'Pre-MS hardening: lifecycle and filename correctness','tree':tree['sha'],'parents':[base]})
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write(f"source_sha={commit['sha']}\nbase_sha={base}\npatch_sha256={os.environ['PATCH_SHA256']}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: extfs-pre-ms-qualified-patch-v2
          path: ${{ runner.temp }}/extfs-qualified/qualified.patch
          if-no-files-found: error
      - name: Report portable candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --repo "${{ github.repository }}" --title '[HAL] ExtFS pre-MS portable PASS' --body "Portable unit tests, real ext2/ext3/ext4 mke2fs/e2fsck mutation qualification, filesystem contracts and MinGW cross-build passed. Detached candidate: ${{ steps.detached.outputs.source_sha }}. Base: ${{ steps.detached.outputs.base_sha }}. Patch SHA-256: ${{ steps.detached.outputs.patch_sha256 }}. WDK x64 + ARM64 are now validating this exact patch. main has not moved."
      - name: Report portable failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          body="$RUNNER_TEMP/failure.md"
          { echo 'Detached pre-MS qualification failed before main moved.'; echo; echo "transform=${{ steps.transform.outcome }}, docs=${{ steps.docs.outcome }}, qualify=${{ steps.qualify.outcome }}, detached=${{ steps.detached.outcome }}"; for f in "$RUNNER_TEMP/extfs-transform.log" "$RUNNER_TEMP/extfs-qualification.log"; do [ -f "$f" ] || continue; echo; echo '```'; tail -n 120 "$f"; echo '```'; done; } > "$body"
          gh issue create --repo "${{ github.repository }}" --title '[HAL] ExtFS pre-MS portable FAILED' --body-file "$body"

  wdk:
    needs: portable
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.portable.outputs.base_sha }}
          fetch-depth: 0
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          name: extfs-pre-ms-qualified-patch-v2
          path: ${{ runner.temp }}\extfs-qualified
      - name: Apply exact qualified patch
        shell: powershell
        run: |
          $p=Join-Path $env:RUNNER_TEMP 'extfs-qualified\qualified.patch'; $h=(Get-FileHash -Algorithm SHA256 -LiteralPath $p).Hash.ToLowerInvariant()
          if ($h -ne '${{ needs.portable.outputs.patch_sha256 }}') { throw "Patch hash mismatch: $h" }
          git apply --binary $p; if ($LASTEXITCODE -ne 0) { throw 'git apply failed' }
          git diff --check; if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed' }
      - name: Verify contracts
        shell: powershell
        run: |
          .\windows\test\Test-FilesystemContracts.ps1
          .\windows\test\Test-InstallerContract.ps1
      - name: Locate NuGet
        shell: powershell
        run: |
          if (-not (Get-Command nuget.exe -ErrorAction SilentlyContinue)) { choco install nuget.commandline -y --no-progress; if ($LASTEXITCODE -ne 0) { throw 'NuGet install failed' } }
      - name: Ensure full WDK validation tools
        timeout-minutes: 15
        shell: powershell
        run: |
          $i=Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10" -Filter Inf2Cat.exe -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $i) { $w=Get-Command winget.exe -ErrorAction Stop; & $w.Source install --source winget --exact --id Microsoft.WindowsWDK.10.0.28000 --accept-package-agreements --accept-source-agreements --silent --disable-interactivity; if ($LASTEXITCODE -ne 0) { throw 'WDK install failed' } }
      - name: Build analyse and validate WDK package
        timeout-minutes: 30
        shell: powershell
        run: .\windows\Build-And-Validate.ps1 -Configuration Release -Platform '${{ matrix.platform }}'
      - name: Report WDK result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: powershell
        run: gh issue create --repo '${{ github.repository }}' --title '[HAL] ExtFS pre-MS WDK ${{ matrix.platform }} ${{ job.status }}' --body "Detached candidate: ${{ needs.portable.outputs.source_sha }}. Exact patch SHA-256: ${{ needs.portable.outputs.patch_sha256 }}. main has not moved."

  report:
    needs: [portable, wdk]
    runs-on: ubuntu-latest
    steps:
      - name: Report fully qualified candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --repo "${{ github.repository }}" --title '[HAL] ExtFS pre-MS candidate PASS' --body "PASS: portable real-image/contracts/cross-build plus WDK Release x64 and ARM64 all passed the exact patch. Detached candidate SHA: ${{ needs.portable.outputs.source_sha }}. Parent/base: ${{ needs.portable.outputs.base_sha }}. Patch SHA-256: ${{ needs.portable.outputs.patch_sha256 }}. Candidate removes all temporary pre-MS workflows/scripts and is ready for owner fast-forward to main."
