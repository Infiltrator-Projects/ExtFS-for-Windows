name: Pre-MS ExtFS qualification v3

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  portable:
    if: github.event.issue.title == '[HAL] Run ExtFS pre-MS v3'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      source_sha: ${{ steps.candidate.outputs.source_sha }}
      base_sha: ${{ steps.candidate.outputs.base_sha }}
      patch_sha256: ${{ steps.candidate.outputs.patch_sha256 }}
    steps:
      - name: Announce
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "Starting detached pre-MS qualification at $GITHUB_SHA. main will not move until portable, real-image, cross-build, WDK x64 and WDK ARM64 all pass."
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Apply audited lifecycle/name transformation
        run: python3 tools/apply-pre-ms-hardening.py
      - name: Update permanent contracts/docs
        run: python3 tools/pre-ms-update-docs.py
      - name: Portable and real-image qualification
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y e2fsprogs make gcc gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64
          make clean
          make
          ./build/test-extfs
          make integration
          pwsh -NoLogo -NoProfile -File windows/test/Test-FilesystemContracts.ps1
          ./windows/build-cross-linux.sh
          git diff --check
      - name: Create exact detached candidate
        id: candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PRE_MS_PATCH: ${{ runner.temp }}/pre-ms/qualified.patch
        run: python3 tools/create-pre-ms-detached.py
      - uses: actions/upload-artifact@v4
        with:
          name: extfs-pre-ms-v3-patch
          path: ${{ runner.temp }}/pre-ms/qualified.patch
          if-no-files-found: error
      - name: Report portable pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "PORTABLE PASS. Candidate ${{ steps.candidate.outputs.source_sha }} from base ${{ steps.candidate.outputs.base_sha }}; patch SHA-256 ${{ steps.candidate.outputs.patch_sha256 }}. Starting x64 and ARM64 WDK against this exact patch."
      - name: Report portable failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "PORTABLE/DETACHED STAGE FAILED. main was not moved. Inspect this workflow run before any source promotion."

  wdk:
    if: github.event.issue.title == '[HAL] Run ExtFS pre-MS v3'
    needs: portable
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.portable.outputs.base_sha }}
          fetch-depth: 0
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          name: extfs-pre-ms-v3-patch
          path: ${{ runner.temp }}\pre-ms
      - name: Apply exact qualified patch
        shell: powershell
        run: |
          $patch = Join-Path $env:RUNNER_TEMP 'pre-ms\qualified.patch'
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $patch).Hash.ToLowerInvariant()
          if ($hash -ne '${{ needs.portable.outputs.patch_sha256 }}') { throw "Patch hash mismatch: $hash" }
          git apply --binary $patch
          if ($LASTEXITCODE -ne 0) { throw 'git apply failed' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed' }
      - name: Verify contracts
        shell: powershell
        run: |
          .\windows\test\Test-FilesystemContracts.ps1
          .\windows\test\Test-InstallerContract.ps1
      - name: Locate NuGet
        shell: powershell
        run: |
          if (-not (Get-Command nuget.exe -ErrorAction SilentlyContinue)) {
              choco install nuget.commandline -y --no-progress
              if ($LASTEXITCODE -ne 0) { throw 'NuGet install failed' }
          }
      - name: Ensure full WDK validation tools
        timeout-minutes: 15
        shell: powershell
        run: |
          $inf2cat = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10" -Filter Inf2Cat.exe -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $inf2cat) {
              $winget = Get-Command winget.exe -ErrorAction Stop
              & $winget.Source install --source winget --exact --id Microsoft.WindowsWDK.10.0.28000 --accept-package-agreements --accept-source-agreements --silent --disable-interactivity
              if ($LASTEXITCODE -ne 0) { throw 'WDK installation failed' }
          }
      - name: WDK Release build analyse validate
        timeout-minutes: 30
        shell: powershell
        run: .\windows\Build-And-Validate.ps1 -Configuration Release -Platform '${{ matrix.platform }}'
      - name: Report platform result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: powershell
        run: gh issue comment '${{ github.event.issue.number }}' --repo '${{ github.repository }}' --body "WDK ${{ matrix.platform }}: ${{ job.status }} for detached candidate ${{ needs.portable.outputs.source_sha }}."

  report:
    if: github.event.issue.title == '[HAL] Run ExtFS pre-MS v3' && success()
    needs: [portable, wdk]
    runs-on: ubuntu-latest
    steps:
      - name: Report full pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "FULL PASS. Portable real-image/contracts/cross-build plus WDK Release x64 and ARM64 all qualified the exact patch. Detached candidate: ${{ needs.portable.outputs.source_sha }}. Base: ${{ needs.portable.outputs.base_sha }}. Patch SHA-256: ${{ needs.portable.outputs.patch_sha256 }}. Candidate already deletes all temporary pre-MS machinery and is ready for owner fast-forward to main."
