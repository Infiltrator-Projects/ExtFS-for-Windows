# SPDX-License-Identifier: GPL-3.0-or-later
name: Apply Windows qualification cleanup polish

on:
  push:
    branches:
      - hardening/v0.9.2
    paths:
      - tools/apply_windows_probe_cleanup.py
      - .github/workflows/apply-windows-probe-cleanup.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/v0.9.2
      - name: Apply targeted cleanup patch
        run: python3 tools/apply_windows_probe_cleanup.py
      - name: Parse patched PowerShell
        shell: pwsh
        run: |
          [void][scriptblock]::Create((Get-Content -LiteralPath 'windows/test/Test-ExtFS.ps1' -Raw))
      - name: Remove one-time helper and commit
        run: |
          rm tools/apply_windows_probe_cleanup.py
          rm .github/workflows/apply-windows-probe-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add windows/test/Test-ExtFS.ps1 tools/apply_windows_probe_cleanup.py .github/workflows/apply-windows-probe-cleanup.yml
          git commit -m "Keep qualification cleanup errors from masking failures"
          git push origin HEAD:hardening/v0.9.2
