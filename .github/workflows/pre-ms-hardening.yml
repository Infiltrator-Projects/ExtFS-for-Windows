# SPDX-License-Identifier: GPL-3.0-or-later
name: Pre-MS ExtFS hardening

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    if: github.event.head_commit.message == 'Start pre-MS ExtFS hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Apply audited correctness patch
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:70]!r}')
              p.write_text(text.replace(old, new, 1))

          replace_once('include/extfs/extfs.h',
                       '#define EXTFS_VERSION_PATCH 2',
                       '#define EXTFS_VERSION_PATCH 3')

          p = Path('core/extfs.c')
          text = p.read_text()
          match = re.search(r'(const char \*extfs_status_string\(extfs_status status\)\s*\{[\s\S]*?)(\n\})', text)
          if not match:
              raise SystemExit('extfs_status_string not found')
          body = match.group(1)
          if 'EXTFS_ERR_NO_SPACE' not in body:
              old = '        default: return "unknown extfs status";'
              if old not in body:
                  raise SystemExit('status-string default not found')
              body = body.replace(old,
                  '        case EXTFS_ERR_NO_SPACE: return "no space left on device";\n' + old, 1)
              text = text[:match.start(1)] + body + text[match.end(1):]
              p.write_text(text)

          replace_once('windows/driver/extfs_driver.h',
              '    volatile LONG FileObjectCount;\n    BOOLEAN Dismounted;',
              '    volatile LONG FileObjectCount;\n    PFILE_OBJECT VolumeLockFileObject;\n    BOOLEAN Dismounted;')

          replace_once('windows/driver/extfs_driver.c',
              '    BOOLEAN CaseSensitive;\n    BOOLEAN Found;\n} EXTFS_DIRENT_PICK, *PEXTFS_DIRENT_PICK;',
              '    BOOLEAN CaseSensitive;\n    BOOLEAN Found;\n    NTSTATUS NameStatus;\n} EXTFS_DIRENT_PICK, *PEXTFS_DIRENT_PICK;')

          replace_once('windows/driver/extfs_driver.c',
              '''    status = ExtfsUtf8ToUnicode(Name, NameLength, unicode,\n                                EXTFS_MAX_NAME_LENGTH, &unicodeLength);\n    if (!NT_SUCCESS(status) ||\n        !ExtfsWildcardMatch(pick->Pattern, pick->PatternLength,\n                            unicode, unicodeLength, pick->CaseSensitive)) {\n        return 0;\n    }''',
              '''    status = ExtfsUtf8ToUnicode(Name, NameLength, unicode,\n                                EXTFS_MAX_NAME_LENGTH, &unicodeLength);\n    if (!NT_SUCCESS(status)) {\n        /* A live ext dentry must never disappear merely because Windows cannot\n         * encode its raw byte name as UTF-16.  Stop enumeration and surface the\n         * conversion error instead of silently skipping the entry. */\n        pick->NameStatus = status;\n        return 1;\n    }\n    if (!ExtfsWildcardMatch(pick->Pattern, pick->PatternLength,\n                            unicode, unicodeLength, pick->CaseSensitive)) {\n        return 0;\n    }''')

          replace_once('windows/driver/extfs_driver.c',
              '''    if (status != EXTFS_OK && status != EXTFS_STOP)\n        return ExtfsStatusToNt(status);\n    return Pick->Found ? STATUS_SUCCESS : STATUS_NO_MORE_FILES;''',
              '''    if (status != EXTFS_OK && status != EXTFS_STOP)\n        return ExtfsStatusToNt(status);\n    if (!NT_SUCCESS(Pick->NameStatus)) return Pick->NameStatus;\n    return Pick->Found ? STATUS_SUCCESS : STATUS_NO_MORE_FILES;''')

          replace_once('windows/driver/extfs_driver.c',
              '''    IoRemoveShareAccess(FileObject, &fcb->ShareAccess);\n    if (fcb->HandleCount > 0) --fcb->HandleCount;\n    ccb->CleanupComplete = TRUE;''',
              '''    IoRemoveShareAccess(FileObject, &fcb->ShareAccess);\n    if (fcb->HandleCount > 0) --fcb->HandleCount;\n    if (fcb->VolumeOpen && fcb->Vcb->VolumeLockFileObject == FileObject) {\n        KIRQL savedIrql;\n        IoAcquireVpbSpinLock(&savedIrql);\n        fcb->Vcb->Vpb->Flags &= (USHORT)~VPB_LOCKED;\n        IoReleaseVpbSpinLock(savedIrql);\n        fcb->Vcb->VolumeLockFileObject = NULL;\n    }\n    ccb->CleanupComplete = TRUE;''')

          driver = Path('windows/driver/extfs_driver.c')
          text = driver.read_text()
          anchor = 'NTSTATUS ExtfsDispatchFileSystemControl(PDEVICE_OBJECT DeviceObject, PIRP Irp)\n{'
          if text.count(anchor) != 1:
              raise SystemExit('FSCTL dispatcher anchor not found')
          helpers = r'''static NTSTATUS ExtfsLockMountedVolume(PEXTFS_VCB Vcb, PFILE_OBJECT FileObject)
{
    PEXTFS_FCB ownerFcb = ExtfsFcbFromFile(FileObject);
    LIST_ENTRY reapList;
    PLIST_ENTRY entry;
    NTSTATUS status = STATUS_ACCESS_DENIED;
    KIRQL savedIrql;
    if (ownerFcb == NULL || ownerFcb->Vcb != Vcb || !ownerFcb->VolumeOpen)
        return STATUS_INVALID_PARAMETER;
    InitializeListHead(&reapList);
    ExtfsAcquireFcbList(Vcb);
    ExtfsCollectReapableFcbsLocked(Vcb, &reapList, FALSE);
    if (Vcb->Dismounted) { status = STATUS_VOLUME_DISMOUNTED; goto ExitLocked; }
    if (Vcb->VolumeLockFileObject != NULL || Vcb->OpenHandleCount != 1 || Vcb->FileObjectCount != 1)
        goto ExitLocked;
    for (entry = Vcb->FcbList.Flink; entry != &Vcb->FcbList; entry = entry->Flink) {
        PEXTFS_FCB fcb = CONTAINING_RECORD(entry, EXTFS_FCB, Links);
        if (fcb != ownerFcb) goto ExitLocked;
    }
    IoAcquireVpbSpinLock(&savedIrql);
    if ((Vcb->Vpb->Flags & VPB_LOCKED) == 0U) {
        Vcb->Vpb->Flags |= VPB_LOCKED;
        Vcb->VolumeLockFileObject = FileObject;
        status = STATUS_SUCCESS;
    }
    IoReleaseVpbSpinLock(savedIrql);
ExitLocked:
    ExtfsReleaseFcbList(Vcb);
    ExtfsDestroyFcbList(&reapList);
    if (NT_SUCCESS(status) && Vcb->WriteEnabled) {
        NTSTATUS flushStatus = ExtfsFlushLowerDevice(&Vcb->Reader);
        if (!NT_SUCCESS(flushStatus)) {
            ExtfsAcquireFcbList(Vcb);
            if (Vcb->VolumeLockFileObject == FileObject) {
                IoAcquireVpbSpinLock(&savedIrql);
                Vcb->Vpb->Flags &= (USHORT)~VPB_LOCKED;
                IoReleaseVpbSpinLock(savedIrql);
                Vcb->VolumeLockFileObject = NULL;
            }
            ExtfsReleaseFcbList(Vcb);
            status = flushStatus;
        }
    }
    return status;
}

static NTSTATUS ExtfsUnlockMountedVolume(PEXTFS_VCB Vcb, PFILE_OBJECT FileObject)
{
    PEXTFS_FCB ownerFcb = ExtfsFcbFromFile(FileObject);
    NTSTATUS status = STATUS_NOT_LOCKED;
    KIRQL savedIrql;
    if (ownerFcb == NULL || ownerFcb->Vcb != Vcb || !ownerFcb->VolumeOpen)
        return STATUS_INVALID_PARAMETER;
    ExtfsAcquireFcbList(Vcb);
    if (Vcb->VolumeLockFileObject == FileObject) {
        IoAcquireVpbSpinLock(&savedIrql);
        Vcb->Vpb->Flags &= (USHORT)~VPB_LOCKED;
        IoReleaseVpbSpinLock(savedIrql);
        Vcb->VolumeLockFileObject = NULL;
        status = STATUS_SUCCESS;
    }
    ExtfsReleaseFcbList(Vcb);
    return status;
}

static NTSTATUS ExtfsDismountLockedVolume(PEXTFS_VCB Vcb, PFILE_OBJECT FileObject)
{
    PEXTFS_FCB ownerFcb = ExtfsFcbFromFile(FileObject);
    KIRQL savedIrql;
    NTSTATUS status;
    if (ownerFcb == NULL || ownerFcb->Vcb != Vcb || !ownerFcb->VolumeOpen)
        return STATUS_INVALID_PARAMETER;
    ExtfsAcquireFcbList(Vcb);
    if (Vcb->VolumeLockFileObject != FileObject) {
        ExtfsReleaseFcbList(Vcb);
        return STATUS_ACCESS_DENIED;
    }
    if (Vcb->Dismounted) {
        ExtfsReleaseFcbList(Vcb);
        return STATUS_VOLUME_DISMOUNTED;
    }
    ExtfsReleaseFcbList(Vcb);
    status = Vcb->WriteEnabled ? ExtfsFlushLowerDevice(&Vcb->Reader) : STATUS_SUCCESS;
    if (!NT_SUCCESS(status)) return status;
    ExtfsAcquireFcbList(Vcb);
    if (Vcb->VolumeLockFileObject != FileObject) {
        ExtfsReleaseFcbList(Vcb);
        return STATUS_ACCESS_DENIED;
    }
    Vcb->Dismounted = TRUE;
    IoAcquireVpbSpinLock(&savedIrql);
    Vcb->Vpb->Flags &= (USHORT)~VPB_MOUNTED;
    IoReleaseVpbSpinLock(savedIrql);
    ExtfsReleaseFcbList(Vcb);
    return STATUS_SUCCESS;
}

'''
          driver.write_text(text.replace(anchor, helpers + anchor, 1))

          replace_once('windows/driver/extfs_driver.c',
              '''        case FSCTL_LOCK_VOLUME:\n        case FSCTL_UNLOCK_VOLUME:\n            /* Exclusive lock ownership is not implemented yet; refusing the\n             * operation is safer than setting VPB_LOCKED without enforcement. */\n            status = STATUS_NOT_SUPPORTED;\n            break;''',
              '''        case FSCTL_LOCK_VOLUME:\n            status = ExtfsLockMountedVolume(vcb, stack->FileObject);\n            break;\n        case FSCTL_UNLOCK_VOLUME:\n            status = ExtfsUnlockMountedVolume(vcb, stack->FileObject);\n            break;\n        case FSCTL_DISMOUNT_VOLUME:\n            status = ExtfsDismountLockedVolume(vcb, stack->FileObject);\n            break;''')

          # Existing handles must stop using a dismounted VCB.
          driver = Path('windows/driver/extfs_driver.c')
          text = driver.read_text()
          old = '''    if (fcb == NULL || fcb->VolumeOpen) {\n        return ExtfsCompleteIrp(Irp, STATUS_INVALID_DEVICE_REQUEST, 0U);\n    }\n    if (extfs_inode_type(&fcb->Inode) == EXTFS_NODE_DIRECTORY) {'''
          if old not in text: raise SystemExit('read guard anchor missing')
          text = text.replace(old, '''    if (fcb == NULL || fcb->VolumeOpen) {\n        return ExtfsCompleteIrp(Irp, STATUS_INVALID_DEVICE_REQUEST, 0U);\n    }\n    if (fcb->Vcb->Dismounted)\n        return ExtfsCompleteIrp(Irp, STATUS_VOLUME_DISMOUNTED, 0U);\n    if (extfs_inode_type(&fcb->Inode) == EXTFS_NODE_DIRECTORY) {''', 1)
          old = '''    if (fcb == NULL || ccb == NULL || fcb->VolumeOpen)\n        return ExtfsCompleteIrp(Irp, STATUS_INVALID_DEVICE_REQUEST, 0U);\n    if (!fcb->Vcb->WriteEnabled)'''
          if text.count(old) < 2: raise SystemExit('write/setinfo guard anchors missing')
          new = '''    if (fcb == NULL || ccb == NULL || fcb->VolumeOpen)\n        return ExtfsCompleteIrp(Irp, STATUS_INVALID_DEVICE_REQUEST, 0U);\n    if (fcb->Vcb->Dismounted)\n        return ExtfsCompleteIrp(Irp, STATUS_VOLUME_DISMOUNTED, 0U);\n    if (!fcb->Vcb->WriteEnabled)'''
          text = text.replace(old, new, 2)
          driver.write_text(text)

          Path('windows/test/Test-FilesystemContracts.ps1').write_text(r'''# SPDX-License-Identifier: GPL-3.0-or-later
$ErrorActionPreference = 'Stop'
$root = Split-Path -Parent (Split-Path -Parent $PSScriptRoot)
$d = Get-Content -LiteralPath (Join-Path $root 'windows\driver\extfs_driver.c') -Raw
$h = Get-Content -LiteralPath (Join-Path $root 'windows\driver\extfs_driver.h') -Raw
$c = Get-Content -LiteralPath (Join-Path $root 'core\extfs.c') -Raw
$ch = Get-Content -LiteralPath (Join-Path $root 'include\extfs\extfs.h') -Raw
foreach ($token in @('VolumeLockFileObject','VPB_LOCKED','ExtfsLockMountedVolume','ExtfsUnlockMountedVolume','ExtfsDismountLockedVolume','FSCTL_DISMOUNT_VOLUME','NameStatus')) {
    if ($d -notmatch [regex]::Escape($token) -and $h -notmatch [regex]::Escape($token)) { throw "Missing filesystem contract: $token" }
}
if ($ch -notmatch '#define EXTFS_VERSION_PATCH 3') { throw 'Portable core version is not 0.9.3.' }
if ($c -notmatch 'EXTFS_ERR_NO_SPACE:\s*return "no space left on device"') { throw 'NO_SPACE status text is missing.' }
Write-Host 'Filesystem contracts: PASS'
''')

      - name: Portable unit and real-image tests
        run: |
          sudo apt-get update
          sudo apt-get install -y e2fsprogs make gcc
          make clean
          make
          ./build/test-extfs
          make integration
          git diff --check

      - name: Commit verified hardening
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA" || { echo 'main moved; refusing stale push'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add include/extfs/extfs.h core/extfs.c windows/driver/extfs_driver.h windows/driver/extfs_driver.c windows/test/Test-FilesystemContracts.ps1
          git commit -m 'Pre-MS hardening: lifecycle and filename correctness'
          git push origin HEAD:main
