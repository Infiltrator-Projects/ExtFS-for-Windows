# SPDX-License-Identifier: GPL-3.0-or-later
name: Pre-MS ExtFS qualification gate

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

env:
  TRIGGER_TITLE: '[HAL] Run ExtFS pre-MS hardening'

jobs:
  portable:
    if: github.event.issue.title == '[HAL] Run ExtFS pre-MS hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      source_sha: ${{ steps.detached.outputs.source_sha }}
      base_sha: ${{ steps.detached.outputs.base_sha }}
      patch_sha256: ${{ steps.detached.outputs.patch_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Announce start
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "Pre-MS qualification started at $GITHUB_SHA. main will not move unless portable, real-image, cross-build and both WDK architectures pass."
      - name: Apply audited source transformation
        id: transform
        shell: bash
        run: |
          set -o pipefail
          python3 tools/apply-pre-ms-hardening.py 2>&1 | tee "$RUNNER_TEMP/extfs-transform.log"
      - name: Update permanent qualification and support documentation
        id: docs
        shell: python
        run: |
          from pathlib import Path
          p = Path('.github/workflows/windows-wdk-ci.yml')
          text = p.read_text()
          needle = '      - name: Locate NuGet\n'
          check = "      - name: Verify filesystem contracts\n        shell: powershell\n        run: .\\windows\\test\\Test-FilesystemContracts.ps1\n\n"
          if check not in text:
              if needle not in text:
                  raise SystemExit('Windows WDK CI insertion point missing')
              p.write_text(text.replace(needle, check + needle, 1))
          p = Path('docs/FEATURE_SUPPORT.md')
          text = p.read_text()
          old = '| Volume lock/unlock | Refused | Exclusive lock ownership/enforcement not implemented |'
          new = '| Volume lock/unlock | Implemented | Direct volume handle only; lock succeeds only when no ordinary opens or mapped-section FCBs remain; ownership follows the issuing FILE_OBJECT and releases on unlock/cleanup |'
          if old in text:
              text = text.replace(old, new, 1)
          if 'Locked-volume dismount' not in text:
              text += '\n| Locked-volume dismount | Implemented bounded path | `FSCTL_DISMOUNT_VOLUME` requires the issuing handle to own an ExtFS volume lock; unlocked forced-dismount teardown remains deferred |\n'
          if 'Unrepresentable raw ext names' not in text:
              text += '| Unrepresentable raw ext names | Explicit failure | ext permits arbitrary non-NUL name bytes; Windows enumeration surfaces a name-conversion error rather than silently hiding a live entry |\n'
          p.write_text(text)
      - name: Portable unit real-image contract and cross-build qualification
        id: qualify
        shell: bash
        run: |
          set -o pipefail
          {
            sudo apt-get update
            sudo apt-get install -y e2fsprogs make gcc gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64
            make clean
            make
            ./build/test-extfs
            make integration
            pwsh -NoLogo -NoProfile -File windows/test/Test-FilesystemContracts.ps1
            ./windows/build-cross-linux.sh
            git diff --check
          } 2>&1 | tee "$RUNNER_TEMP/extfs-qualification.log"
      - name: Build exact detached candidate and patch
        id: detached
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git rm -f tools/apply-pre-ms-hardening.py .github/workflows/pre-ms-hardening.yml .github/workflows/run-pre-ms-hardening.yml
          mkdir -p "$RUNNER_TEMP/extfs-qualified"
          git diff --binary HEAD > "$RUNNER_TEMP/extfs-qualified/qualified.patch"
          patch_sha=$(sha256sum "$RUNNER_TEMP/extfs-qualified/qualified.patch" | awk '{print $1}')
          export PATCH_SHA256="$patch_sha"
          python3 - <<'PY'
          import base64, json, os, pathlib, subprocess, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']; token = os.environ['GITHUB_TOKEN']; base = os.environ['GITHUB_SHA']
          api = f'https://api.github.com/repos/{repo}'
          def request(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(api + path, data=data, method=method)
              req.add_header('Authorization', f'Bearer {token}')
              req.add_header('Accept', 'application/vnd.github+json')
              req.add_header('X-GitHub-Api-Version', '2022-11-28')
              with urllib.request.urlopen(req) as r: return json.load(r)
          base_commit = request('GET', f'/git/commits/{base}')
          entries = []
          fields = subprocess.check_output(['git','diff','--name-status','-z','HEAD']).decode().split('\0')
          i = 0
          while i < len(fields) and fields[i]:
              status = fields[i]; i += 1; path = fields[i]; i += 1
              if status.startswith('R') or status.startswith('C'): path = fields[i]; i += 1
              if status.startswith('D'):
                  entries.append({'path':path,'mode':'100644','type':'blob','sha':None}); continue
              content = pathlib.Path(path).read_bytes()
              blob = request('POST','/git/blobs',{'content':base64.b64encode(content).decode(),'encoding':'base64'})
              mode = subprocess.check_output(['git','ls-files','-s','--',path]).decode().split()[0] if subprocess.check_output(['git','ls-files','-s','--',path]).strip() else '100644'
              entries.append({'path':path,'mode':mode,'type':'blob','sha':blob['sha']})
          tree = request('POST','/git/trees',{'base_tree':base_commit['tree']['sha'],'tree':entries})
          commit = request('POST','/git/commits',{'message':'Pre-MS hardening: lifecycle and filename correctness','tree':tree['sha'],'parents':[base]})
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f"source_sha={commit['sha']}\nbase_sha={base}\npatch_sha256={os.environ['PATCH_SHA256']}\n")
          print('Detached qualified candidate:', commit['sha'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: extfs-pre-ms-qualified-patch
          path: ${{ runner.temp }}/extfs-qualified/qualified.patch
          if-no-files-found: error
      - name: Report portable success
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "Portable/real-image/contracts/cross-build PASS. Detached candidate: ${{ steps.detached.outputs.source_sha }}. Patch SHA-256: ${{ steps.detached.outputs.patch_sha256 }}. Starting WDK x64 + ARM64 against this exact patch."
      - name: Report portable failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          report="$RUNNER_TEMP/extfs-failure.txt"
          {
            echo 'Pre-MS qualification stopped before main moved.'
            echo "Stage outcomes: transform=${{ steps.transform.outcome }}, docs=${{ steps.docs.outcome }}, qualify=${{ steps.qualify.outcome }}, detached=${{ steps.detached.outcome }}"
            for log in "$RUNNER_TEMP/extfs-transform.log" "$RUNNER_TEMP/extfs-qualification.log"; do [ -f "$log" ] || continue; echo; echo "--- $(basename "$log") tail ---"; tail -n 120 "$log"; done
          } > "$report"
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body-file "$report"
  wdk:
    if: github.event.issue.title == '[HAL] Run ExtFS pre-MS hardening'
    needs: portable
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.portable.outputs.base_sha }}
          fetch-depth: 0
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          name: extfs-pre-ms-qualified-patch
          path: ${{ runner.temp }}\extfs-qualified
      - name: Apply exact qualified patch
        shell: powershell
        run: |
          $patch = Join-Path $env:RUNNER_TEMP 'extfs-qualified\qualified.patch'
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $patch).Hash.ToLowerInvariant()
          if ($actual -ne '${{ needs.portable.outputs.patch_sha256 }}') { throw "Patch hash mismatch: $actual" }
          git apply --binary $patch
          if ($LASTEXITCODE -ne 0) { throw "git apply failed with exit code $LASTEXITCODE" }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Qualified patch failed git diff --check.' }
      - name: Verify filesystem and installer contracts
        shell: powershell
        run: |
          .\windows\test\Test-FilesystemContracts.ps1
          .\windows\test\Test-InstallerContract.ps1
      - name: Locate NuGet
        timeout-minutes: 5
        shell: powershell
        run: |
          if (-not (Get-Command nuget.exe -ErrorAction SilentlyContinue)) { choco install nuget.commandline -y --no-progress; if ($LASTEXITCODE -ne 0) { throw "Chocolatey NuGet install failed with exit code $LASTEXITCODE." } }
      - name: Ensure full WDK validation tools
        timeout-minutes: 15
        shell: powershell
        run: |
          $inf2cat = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10" -Filter Inf2Cat.exe -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $inf2cat) { $winget = Get-Command winget.exe -ErrorAction Stop; & $winget.Source install --source winget --exact --id Microsoft.WindowsWDK.10.0.28000 --accept-package-agreements --accept-source-agreements --silent --disable-interactivity; if ($LASTEXITCODE -ne 0) { throw "WDK installation failed with exit code $LASTEXITCODE." } }
      - name: Build analyse and validate WDK package
        shell: powershell
        timeout-minutes: 30
        run: .\windows\Build-And-Validate.ps1 -Configuration Release -Platform '${{ matrix.platform }}'
      - name: Report WDK failure
        if: failure()
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment '${{ github.event.issue.number }}' --repo '${{ github.repository }}' --body "WDK FAIL: ${{ matrix.platform }} for detached candidate ${{ needs.portable.outputs.source_sha }}. main was not moved."
  report:
    if: github.event.issue.title == '[HAL] Run ExtFS pre-MS hardening' && success()
    needs: [portable, wdk]
    runs-on: ubuntu-latest
    steps:
      - name: Report exact candidate ready for main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "PASS: portable real-image/cross-build and WDK x64 + ARM64 all qualified the exact hardening patch. Detached candidate ready to fast-forward main: ${{ needs.portable.outputs.source_sha }}. Parent/base: ${{ needs.portable.outputs.base_sha }}. Patch SHA-256: ${{ needs.portable.outputs.patch_sha256 }}. The candidate already removes all temporary hardening workflows/scripts."
