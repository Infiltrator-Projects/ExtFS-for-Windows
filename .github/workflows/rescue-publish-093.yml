# SPDX-License-Identifier: GPL-3.0-or-later
name: Fast publish ExtFS 0.9.3

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    if: github.event_name == 'push' || github.head_ref == 'forensic-fix-common19'
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d7b43df5c672927b767e2ef63a58b724f23c61ad
          fetch-depth: 0
          submodules: recursive

      - name: Verify exact qualified release source
        shell: powershell
        run: |
          $actual = (git rev-parse HEAD).Trim()
          $expected = 'd7b43df5c672927b767e2ef63a58b724f23c61ad'
          if ($actual -ne $expected) { throw "Release source mismatch: expected $expected, found $actual" }
          if ((Get-Content -LiteralPath 'third_party\infiltratr-common\VERSION' -Raw).Trim() -ne '1.9.0') {
              throw 'Infiltratr Common is not pinned at 1.9.0.'
          }

      - name: Locate NuGet
        shell: powershell
        run: |
          $nuget = Get-Command nuget.exe -ErrorAction SilentlyContinue
          if (-not $nuget) {
              choco install nuget.commandline -y --no-progress
              if ($LASTEXITCODE -ne 0) { throw "Chocolatey NuGet install failed with exit code $LASTEXITCODE." }
          }

      - name: Ensure full WDK validation tools
        shell: powershell
        run: |
          $inf2cat = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10" -Filter Inf2Cat.exe -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $inf2cat) {
              $winget = Get-Command winget.exe -ErrorAction Stop
              & $winget.Source install --source winget --exact --id Microsoft.WindowsWDK.10.0.28000 --accept-package-agreements --accept-source-agreements --silent --disable-interactivity
              if ($LASTEXITCODE -ne 0) { throw "WDK installation failed with exit code $LASTEXITCODE." }
          }

      - name: Ensure NSIS
        shell: powershell
        run: |
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue) -and
              -not (Test-Path -LiteralPath (Join-Path $env:ProgramFiles 'NSIS\makensis.exe')) -and
              -not (Test-Path -LiteralPath (Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'))) {
              choco install nsis -y --no-progress
              if ($LASTEXITCODE -ne 0) { throw "Chocolatey NSIS install failed with exit code $LASTEXITCODE." }
          }

      - name: Build and verify installer
        shell: powershell
        run: |
          # The exact source already passed the full native WDK/Code Analysis gate.
          # Package publication therefore skips the redundant second Code Analysis pass.
          .\windows\Build-ExperimentalSetup.ps1 -SkipCodeAnalysis
          $setup = 'ExtFS-for-Windows-0.9.3-experimental-x64-setup.exe'
          if (-not (Test-Path -LiteralPath $setup)) { throw "Expected installer not produced: $setup" }
          $version = (Get-Item -LiteralPath $setup).VersionInfo.FileVersion
          if ($version -ne '0.9.3.0') { throw "Installer version mismatch: expected 0.9.3.0, found '$version'." }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $setup).Hash
          "EXTFS_SETUP_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Installer SHA-256: $hash"

      - name: Publish or repair GitHub Release v0.9.3
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = 'ExtFS-for-Windows-0.9.3-experimental-x64-setup.exe'
          $notes = @"
          ExtFS for Windows 0.9.3 is the Windows-lifecycle/Common-1.9 maintenance release on the 0.9.2 audit-hardened filesystem feature boundary.

          Changes:
          - safe shared-FCB lifetime reclamation with FILE_OBJECT/live-section safeguards;
          - removable-media read-only characteristic resynchronisation;
          - corrected 0.9.3 binary/INF/installer metadata;
          - Infiltratr Common 1.9.0 pinned at a65b279b40682791f2cfefb4d9bdc274790b0c77;
          - unchanged conservative ext2/ext3/ext4 mutation boundary.

          Development/test-signed experimental kernel driver. Use only on disposable/test Windows systems and backed-up test volumes.

          Installer SHA-256: $env:EXTFS_SETUP_SHA256
          "@
          Set-Content -LiteralPath release-notes.md -Value $notes -Encoding utf8

          & gh release view v0.9.3 --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
              & gh release create v0.9.3 $setup --repo $env:GITHUB_REPOSITORY --target d7b43df5c672927b767e2ef63a58b724f23c61ad --title 'ExtFS for Windows 0.9.3' --notes-file release-notes.md
              if ($LASTEXITCODE -ne 0) { throw "GitHub release creation failed with exit code $LASTEXITCODE." }
          } else {
              $existing = & gh release view v0.9.3 --repo $env:GITHUB_REPOSITORY --json assets | ConvertFrom-Json
              $asset = @($existing.assets | Where-Object name -eq $setup)
              if ($asset.Count -eq 0) {
                  & gh release upload v0.9.3 $setup --repo $env:GITHUB_REPOSITORY --clobber
                  if ($LASTEXITCODE -ne 0) { throw "GitHub release asset upload failed with exit code $LASTEXITCODE." }
              }
          }

          $json = & gh release view v0.9.3 --repo $env:GITHUB_REPOSITORY --json tagName,name,assets,isDraft,isPrerelease,targetCommitish
          if ($LASTEXITCODE -ne 0) { throw 'v0.9.3 is not published.' }
          $release = $json | ConvertFrom-Json
          if ($release.tagName -ne 'v0.9.3' -or $release.name -ne 'ExtFS for Windows 0.9.3' -or $release.isDraft -or $release.isPrerelease) {
              throw 'v0.9.3 release metadata is incorrect.'
          }
          $asset = @($release.assets | Where-Object name -eq $setup)
          if ($asset.Count -ne 1) { throw "Expected exactly one installer asset '$setup'; found $($asset.Count)." }
          Write-Host "Published and verified v0.9.3 with installer asset $setup"

      - name: Remove temporary branches
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = $env:GITHUB_REPOSITORY
          & gh pr close 5 --repo $repo --comment '0.9.3 publication rescue completed; closing temporary trigger PR.' *> $null
          foreach ($branch in @('forensic-fix-common19', 'release-093-fast-publish', 'release-093-observable')) {
              & gh api --method DELETE "repos/$repo/git/refs/heads/$branch" *> $null
              if ($LASTEXITCODE -ne 0) {
                  Write-Host "Branch $branch was already absent or could not be removed in this pass."
              } else {
                  Write-Host "Deleted temporary branch $branch"
              }
          }
