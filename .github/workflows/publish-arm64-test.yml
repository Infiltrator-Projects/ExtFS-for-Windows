# SPDX-License-Identifier: GPL-3.0-or-later
name: Publish ExtFS 0.9.3 ARM64 test preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-arm64-test:
    runs-on: windows-latest
    timeout-minutes: 50
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          submodules: recursive

      - name: Verify exact current main and prerelease absence
        timeout-minutes: 2
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main --tags
          if ((git rev-parse HEAD).Trim() -ne (git rev-parse origin/main).Trim()) {
              throw 'Release workflow is not running from exact current main.'
          }
          if ((Get-Content -LiteralPath 'third_party\infiltratr-common\VERSION' -Raw).Trim() -ne '1.9.0') { throw 'Infiltratr Common is not pinned at 1.9.0.' }
          $sourceDriverVer = Get-Content -LiteralPath 'windows\driver\extfs.inf' | Where-Object { $_ -match '^\s*DriverVer\s*=' } | Select-Object -First 1
          if (($sourceDriverVer -replace '\s', '') -ne 'DriverVer=08/20/2026,0.9.3.0') { throw "Source INF version mismatch: '$sourceDriverVer'." }
          if (git rev-parse -q --verify refs/tags/v0.9.3-arm64-test.1 2>$null) {
              throw 'Prerelease tag v0.9.3-arm64-test.1 already exists; published releases are immutable.'
          }
          & gh release view v0.9.3-arm64-test.1 --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Prerelease v0.9.3-arm64-test.1 already exists; published releases are immutable.' }
          $global:LASTEXITCODE = 0

      - name: Locate NuGet
        timeout-minutes: 5
        shell: powershell
        run: |
          if (-not (Get-Command nuget.exe -ErrorAction SilentlyContinue)) {
              choco install nuget.commandline -y --no-progress
              if ($LASTEXITCODE -ne 0) { throw "Chocolatey NuGet install failed with exit code $LASTEXITCODE." }
          }

      - name: Ensure full WDK validation tools
        timeout-minutes: 15
        shell: powershell
        run: |
          $inf2cat = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10" -Filter Inf2Cat.exe -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $inf2cat) {
              $winget = Get-Command winget.exe -ErrorAction Stop
              & $winget.Source install --source winget --exact --id Microsoft.WindowsWDK.10.0.28000 --accept-package-agreements --accept-source-agreements --silent --disable-interactivity
              if ($LASTEXITCODE -ne 0) { throw "WDK WinGet installation failed with exit code $LASTEXITCODE." }
              $inf2cat = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10" -Filter Inf2Cat.exe -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $inf2cat) { throw 'Full WDK installed but Inf2Cat.exe is still unavailable.' }

      - name: Ensure NSIS
        timeout-minutes: 5
        shell: powershell
        run: |
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue) -and -not (Test-Path -LiteralPath (Join-Path $env:ProgramFiles 'NSIS\makensis.exe')) -and -not (Test-Path -LiteralPath (Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'))) {
              choco install nsis -y --no-progress
              if ($LASTEXITCODE -ne 0) { throw "Chocolatey NSIS install failed with exit code $LASTEXITCODE." }
          }

      - name: Build and verify ARM64 installer
        timeout-minutes: 25
        shell: powershell
        run: |
          .\windows\Build-ExperimentalSetup.ps1 -Platform ARM64 -SkipCodeAnalysis
          $setup = 'ExtFS-for-Windows-0.9.3-experimental-arm64-setup.exe'
          if (-not (Test-Path -LiteralPath $setup)) { throw "Expected installer not produced: $setup" }
          if ((Get-Item -LiteralPath $setup).VersionInfo.FileVersion -ne '0.9.3.0') { throw 'Installer version mismatch.' }
          $driverVer = Get-Content -LiteralPath 'release\driver\extfs.inf' | Where-Object { $_ -match '^\s*DriverVer\s*=' } | Select-Object -First 1
          if (($driverVer -replace '\s', '') -ne 'DriverVer=08/20/2026,0.9.3.0') { throw "Staged INF version mismatch: '$driverVer'." }
          $report = Get-Content -LiteralPath 'release\driver\build-report.txt' -Raw
          if ($report -notmatch '(?m)^Platform: ARM64\r?$' -or $report -notmatch '(?m)^PEMachine: 0xAA64\r?$' -or $report -notmatch '(?m)^CatalogMembershipVerified: True\r?$') {
              throw 'ARM64 architecture or catalog evidence is incomplete.'
          }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $setup).Hash
          "EXTFS_ARM64_SETUP_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Installer SHA-256: $hash"

      - name: Publish and verify ARM64 test prerelease
        timeout-minutes: 5
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = 'ExtFS-for-Windows-0.9.3-experimental-arm64-setup.exe'
          $target = (git rev-parse HEAD).Trim()
          $notes = @"
          ExtFS for Windows 0.9.3 ARM64 test preview 1 is a test-only ARM64 build of the existing bounded 0.9.3 filesystem checkpoint.

          This is not a production release. It is development/test signed and requires a disposable ARM64 Windows test system with Secure Boot disabled, TESTSIGNING enabled, a complete backup, and a disposable external ext test volume. Begin with read-only access. Do not use it on important data.

          The installer, driver PE header, INF catalog membership and ARM64 package metadata were validated by the WDK pipeline.

          Installer SHA-256: $env:EXTFS_ARM64_SETUP_SHA256
          "@
          Set-Content -LiteralPath release-notes-arm64.md -Value $notes -Encoding utf8
          & gh release create v0.9.3-arm64-test.1 $setup --repo $env:GITHUB_REPOSITORY --target $target --title 'ExtFS for Windows 0.9.3 ARM64 test preview 1' --notes-file release-notes-arm64.md --prerelease
          if ($LASTEXITCODE -ne 0) { throw "GitHub prerelease creation failed with exit code $LASTEXITCODE." }

          $release = & gh release view v0.9.3-arm64-test.1 --repo $env:GITHUB_REPOSITORY --json tagName,name,assets,isDraft,isPrerelease,targetCommitish | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $release.tagName -ne 'v0.9.3-arm64-test.1' -or $release.name -ne 'ExtFS for Windows 0.9.3 ARM64 test preview 1' -or $release.isDraft -or -not $release.isPrerelease) {
              throw 'Published ARM64 prerelease metadata is incorrect.'
          }
          $assets = @($release.assets | Where-Object name -eq $setup)
          if ($assets.Count -ne 1) { throw "Expected exactly one installer asset '$setup'." }
          Write-Host "Published and verified v0.9.3-arm64-test.1 with $setup"
