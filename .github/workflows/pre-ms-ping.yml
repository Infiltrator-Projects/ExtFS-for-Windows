name: Pre-MS dispatch probe
on:
  issues:
    types: [opened]
permissions:
  issues: write
jobs:
  ping:
    if: github.event.issue.title == '[HAL] Pre-MS ping'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body 'PING PASS: issue-triggered Actions dispatch is working.'
