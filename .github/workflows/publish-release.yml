# SPDX-License-Identifier: GPL-3.0-or-later
name: Publish ExtFS 0.9.4 installer hotfix

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  publish-v094:
    if: startsWith(github.event.head_commit.message, 'Publish ExtFS 0.9.4 installer hotfix')
    runs-on: windows-latest
    timeout-minutes: 50
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verify release source and installer contract
        timeout-minutes: 2
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ((Get-Content -LiteralPath 'third_party\infiltratr-common\VERSION' -Raw).Trim() -ne '1.9.0') {
              throw 'Infiltratr Common is not pinned at 1.9.0.'
          }
          .\windows\test\Test-InstallerContract.ps1

          # 0.9.4 repairs installer/service creation only. The driver payload is
          # intentionally unchanged from the already-qualified 0.9.3 driver.
          $sourceDriverVer = Get-Content -LiteralPath 'windows\driver\extfs.inf' | Where-Object { $_ -match '^\s*DriverVer\s*=' } | Select-Object -First 1
          if (($sourceDriverVer -replace '\s', '') -ne 'DriverVer=08/20/2026,0.9.3.0') {
              throw "Unexpected driver payload version for installer hotfix: '$sourceDriverVer'."
          }

          $releaseUri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/v0.9.4"
          $headers = @{
              Authorization = "Bearer $env:GH_TOKEN"
              Accept = 'application/vnd.github+json'
              'X-GitHub-Api-Version' = '2022-11-28'
          }
          try {
              Invoke-RestMethod -Uri $releaseUri -Headers $headers -Method Get | Out-Null
              throw 'Release v0.9.4 already exists; refusing to overwrite it.'
          } catch {
              if ($_.Exception.Message -eq 'Release v0.9.4 already exists; refusing to overwrite it.') { throw }
              $status = [int]$_.Exception.Response.StatusCode
              if ($status -ne 404) { throw }
          }

      - name: Locate NuGet
        timeout-minutes: 5
        shell: powershell
        run: |
          $nuget = Get-Command nuget.exe -ErrorAction SilentlyContinue
          if (-not $nuget) {
              choco install nuget.commandline -y --no-progress
              if ($LASTEXITCODE -ne 0) { throw "Chocolatey NuGet install failed with exit code $LASTEXITCODE." }
          }

      - name: Ensure full WDK validation tools
        timeout-minutes: 15
        shell: powershell
        run: |
          $inf2cat = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10" -Filter Inf2Cat.exe -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $inf2cat) {
              $winget = Get-Command winget.exe -ErrorAction Stop
              & $winget.Source install --source winget --exact --id Microsoft.WindowsWDK.10.0.28000 --accept-package-agreements --accept-source-agreements --silent --disable-interactivity
              if ($LASTEXITCODE -ne 0) { throw "WDK WinGet installation failed with exit code $LASTEXITCODE." }
          }

      - name: Ensure NSIS
        timeout-minutes: 5
        shell: powershell
        run: |
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue) -and -not (Test-Path -LiteralPath (Join-Path $env:ProgramFiles 'NSIS\makensis.exe')) -and -not (Test-Path -LiteralPath (Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'))) {
              choco install nsis -y --no-progress
              if ($LASTEXITCODE -ne 0) { throw "Chocolatey NSIS install failed with exit code $LASTEXITCODE." }
          }

      - name: Build and verify x64 hotfix installer
        timeout-minutes: 25
        shell: powershell
        run: |
          .\windows\Build-ExperimentalSetup.ps1 -Platform x64 -SkipCodeAnalysis
          $setup = 'ExtFS-for-Windows-0.9.4-experimental-x64-setup.exe'
          if (-not (Test-Path -LiteralPath $setup)) { throw "Expected installer not produced: $setup" }
          $version = (Get-Item -LiteralPath $setup).VersionInfo.FileVersion
          if ($version -ne '0.9.4.0') { throw "Installer version mismatch: expected 0.9.4.0, found '$version'." }
          $driverVer = Get-Content -LiteralPath 'release\driver\extfs.inf' | Where-Object { $_ -match '^\s*DriverVer\s*=' } | Select-Object -First 1
          if (($driverVer -replace '\s', '') -ne 'DriverVer=08/20/2026,0.9.3.0') { throw "Staged driver payload mismatch: '$driverVer'." }
          $report = Get-Content -LiteralPath 'release\driver\build-report.txt' -Raw
          if ($report -notmatch '(?m)^PackageVersion: 0\.9\.4\r?$') { throw 'Package-version evidence is missing.' }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $setup).Hash
          "EXTFS_SETUP_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Installer SHA-256: $hash"

      - name: Publish and verify GitHub Release v0.9.4
        timeout-minutes: 5
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = 'ExtFS-for-Windows-0.9.4-experimental-x64-setup.exe'
          $notes = @"
          ExtFS for Windows 0.9.4 is an installer-only hotfix for the 0.9.3 driver release.

          Fixed:
          - corrects the Windows filesystem-service ImagePath from the malformed doubled-backslash form to the required NT path \SystemRoot\System32\drivers\extfs.sys;
          - validates the actual service ImagePath, Type and Start values in HKLM before asking Windows to load the driver;
          - restores the File System load-order group when creating the service;
          - includes recent Service Control Manager and Code Integrity diagnostics if the kernel still refuses a load;
          - adds a CI regression test for the service-path contract.

          Driver payload: unchanged 0.9.3.0 filesystem driver, already qualified by the WDK/package gates.
          Shared dependency: Infiltratr Common 1.9.0 pinned at a65b279b40682791f2cfefb4d9bdc274790b0c77.

          This installer is development/test signed and remains experimental. Use it only on disposable/test Windows systems and backed-up test volumes.

          Installer SHA-256: $env:EXTFS_SETUP_SHA256
          "@
          Set-Content -LiteralPath release-notes.md -Value $notes -Encoding utf8
          & gh release create v0.9.4 $setup --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'ExtFS for Windows 0.9.4' --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw "GitHub release creation failed with exit code $LASTEXITCODE." }

          $release = & gh release view v0.9.4 --repo $env:GITHUB_REPOSITORY --json tagName,name,assets,isDraft,isPrerelease,targetCommitish | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $release.tagName -ne 'v0.9.4' -or $release.name -ne 'ExtFS for Windows 0.9.4' -or $release.isDraft -or $release.isPrerelease) {
              throw 'Published v0.9.4 release metadata is incorrect.'
          }
          $assets = @($release.assets | Where-Object name -eq $setup)
          if ($assets.Count -ne 1) { throw "Expected exactly one installer asset '$setup'." }
          Write-Host "Published and verified v0.9.4 with $setup"

  cleanup-v094:
    if: always() && startsWith(github.event.head_commit.message, 'Publish ExtFS 0.9.4 installer hotfix') && needs.publish-v094.result == 'success'
    needs: publish-v094
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Verify v0.9.4 and remove temporary branches
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{
              Authorization = "Bearer $env:GH_TOKEN"
              Accept = 'application/vnd.github+json'
              'X-GitHub-Api-Version' = '2022-11-28'
          }
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/v0.9.4" -Headers $headers -Method Get
          $setup = 'ExtFS-for-Windows-0.9.4-experimental-x64-setup.exe'
          $assets = @($release.assets | Where-Object name -eq $setup)
          if ($release.draft -or $release.prerelease -or $assets.Count -ne 1) {
              throw 'Refusing cleanup because v0.9.4 was not verified.'
          }

          foreach ($branch in @(
              'hotfix-0.9.4-installer-path',
              'codex/extfs-arm64-publish-fix',
              'codex/extfs-arm64-test-readiness'
          )) {
              $encodedBranch = [Uri]::EscapeDataString($branch)
              $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/git/refs/heads/$encodedBranch"
              try {
                  Invoke-RestMethod -Uri $uri -Headers $headers -Method Delete
                  Write-Host "Deleted temporary branch $branch"
              } catch {
                  $status = [int]$_.Exception.Response.StatusCode
                  if ($status -eq 404) {
                      Write-Host "Branch $branch is already absent."
                  } else {
                      throw
                  }
              }
          }
