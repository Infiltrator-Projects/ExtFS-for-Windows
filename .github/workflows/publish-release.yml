# SPDX-License-Identifier: GPL-3.0-or-later
name: Publish ExtFS 0.9.6 pending-restart hotfix

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  publish-v096:
    if: startsWith(github.event.head_commit.message, 'Publish ExtFS 0.9.6 pending-restart hotfix')
    runs-on: windows-latest
    timeout-minutes: 50
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verify release source and installer contracts
        timeout-minutes: 2
        shell: powershell
        run: |
          if ((Get-Content -LiteralPath 'third_party\infiltratr-common\VERSION' -Raw).Trim() -ne '1.9.0') { throw 'Infiltratr Common is not pinned at 1.9.0.' }
          .\windows\test\Test-InstallerContract.ps1
          $sourceDriverVer = Get-Content -LiteralPath 'windows\driver\extfs.inf' | Where-Object { $_ -match '^\s*DriverVer\s*=' } | Select-Object -First 1
          if (($sourceDriverVer -replace '\s', '') -ne 'DriverVer=08/20/2026,0.9.3.0') { throw "Unexpected driver payload version: '$sourceDriverVer'." }

      - name: Locate NuGet
        timeout-minutes: 5
        shell: powershell
        run: |
          if (-not (Get-Command nuget.exe -ErrorAction SilentlyContinue)) {
              choco install nuget.commandline -y --no-progress
              if ($LASTEXITCODE -ne 0) { throw "Chocolatey NuGet install failed with exit code $LASTEXITCODE." }
          }

      - name: Ensure full WDK validation tools
        timeout-minutes: 15
        shell: powershell
        run: |
          $inf2cat = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10" -Filter Inf2Cat.exe -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $inf2cat) {
              $winget = Get-Command winget.exe -ErrorAction Stop
              & $winget.Source install --source winget --exact --id Microsoft.WindowsWDK.10.0.28000 --accept-package-agreements --accept-source-agreements --silent --disable-interactivity
              if ($LASTEXITCODE -ne 0) { throw "WDK WinGet installation failed with exit code $LASTEXITCODE." }
          }

      - name: Ensure NSIS
        timeout-minutes: 5
        shell: powershell
        run: |
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue) -and -not (Test-Path -LiteralPath (Join-Path $env:ProgramFiles 'NSIS\makensis.exe')) -and -not (Test-Path -LiteralPath (Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'))) {
              choco install nsis -y --no-progress
              if ($LASTEXITCODE -ne 0) { throw "Chocolatey NSIS install failed with exit code $LASTEXITCODE." }
          }

      - name: Build and verify x64 hotfix installer
        timeout-minutes: 25
        shell: powershell
        run: |
          .\windows\Build-ExperimentalSetup.ps1 -Platform x64 -SkipCodeAnalysis
          $setup = 'ExtFS-for-Windows-0.9.6-experimental-x64-setup.exe'
          if (-not (Test-Path -LiteralPath $setup)) { throw "Expected installer not produced: $setup" }
          $version = (Get-Item -LiteralPath $setup).VersionInfo.FileVersion
          if ($version -ne '0.9.6.0') { throw "Installer version mismatch: expected 0.9.6.0, found '$version'." }
          $driverVer = Get-Content -LiteralPath 'release\driver\extfs.inf' | Where-Object { $_ -match '^\s*DriverVer\s*=' } | Select-Object -First 1
          if (($driverVer -replace '\s', '') -ne 'DriverVer=08/20/2026,0.9.3.0') { throw "Staged driver payload mismatch: '$driverVer'." }
          $report = Get-Content -LiteralPath 'release\driver\build-report.txt' -Raw
          if ($report -notmatch '(?m)^PackageVersion: 0\.9\.6\r?$') { throw 'Package-version evidence is missing.' }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $setup).Hash
          "EXTFS_SETUP_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Installer SHA-256: $hash"

      - name: Publish and verify GitHub Release v0.9.6
        timeout-minutes: 5
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = 'ExtFS-for-Windows-0.9.6-experimental-x64-setup.exe'
          $notes = @"
          ExtFS for Windows 0.9.6 is an installer-only pending-restart hotfix carrying the already-qualified ExtFS 0.9.3.0 filesystem driver.

          Fixed:
          - unrelated PendingFileRenameOperations, Windows Update RebootRequired and CBS RebootPending states are advisory instead of fatal;
          - ExtFS-specific pending file replacements still require a reboot;
          - when ExtFS enables TESTSIGNING it records the current boot and requires one real reboot before proceeding;
          - retains the 0.9.5 native architecture fix and 0.9.4 service ImagePath fix.

          Driver payload: unchanged 0.9.3.0 filesystem driver.
          Shared dependency: Infiltratr Common 1.9.0 pinned at a65b279b40682791f2cfefb4d9bdc274790b0c77.

          Installer SHA-256: $env:EXTFS_SETUP_SHA256
          "@
          Set-Content -LiteralPath release-notes.md -Value $notes -Encoding utf8
          & gh release view v0.9.6 --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
              & gh release upload v0.9.6 $setup --repo $env:GITHUB_REPOSITORY --clobber
              if ($LASTEXITCODE -ne 0) { throw "GitHub release upload failed with exit code $LASTEXITCODE." }
              & gh release edit v0.9.6 --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'ExtFS for Windows 0.9.6' --notes-file release-notes.md
              if ($LASTEXITCODE -ne 0) { throw "GitHub release edit failed with exit code $LASTEXITCODE." }
          } else {
              & gh release create v0.9.6 $setup --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'ExtFS for Windows 0.9.6' --notes-file release-notes.md
              if ($LASTEXITCODE -ne 0) { throw "GitHub release creation failed with exit code $LASTEXITCODE." }
          }
          $release = & gh release view v0.9.6 --repo $env:GITHUB_REPOSITORY --json tagName,name,assets,isDraft,isPrerelease,targetCommitish | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $release.tagName -ne 'v0.9.6' -or $release.name -ne 'ExtFS for Windows 0.9.6' -or $release.isDraft -or $release.isPrerelease) { throw 'Published v0.9.6 release metadata is incorrect.' }
          $assets = @($release.assets | Where-Object name -eq $setup)
          if ($assets.Count -ne 1) { throw "Expected exactly one installer asset '$setup'." }
          Write-Host "Published and verified v0.9.6 with $setup"

      - name: Record publication receipt on main
        shell: powershell
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --allow-empty -m 'ExtFS 0.9.6 release published'
          if ($LASTEXITCODE -ne 0) { throw 'Failed to create publication receipt commit.' }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw 'Failed to push publication receipt commit.' }
