# SPDX-License-Identifier: GPL-3.0-or-later
name: Publish ExtFS 0.9.3 recovery

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  publish-v093:
    if: startsWith(github.event.head_commit.message, 'Publish ExtFS 0.9.3 recovery')
    runs-on: windows-latest
    timeout-minutes: 50
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verify release source and absence
        timeout-minutes: 2
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ((Get-Content -LiteralPath 'third_party\infiltratr-common\VERSION' -Raw).Trim() -ne '1.9.0') { throw 'Infiltratr Common is not pinned at 1.9.0.' }
          $sourceDriverVer = Get-Content -LiteralPath 'windows\driver\extfs.inf' | Where-Object { $_ -match '^\s*DriverVer\s*=' } | Select-Object -First 1
          if (($sourceDriverVer -replace '\s', '') -ne 'DriverVer=08/20/2026,0.9.3.0') { throw "Source INF version mismatch: '$sourceDriverVer'." }
          $releaseUri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/v0.9.3"
          $headers = @{
              Authorization = "Bearer $env:GH_TOKEN"
              Accept = 'application/vnd.github+json'
              'X-GitHub-Api-Version' = '2022-11-28'
          }
          $releaseExists = $false
          try {
              Invoke-RestMethod -Uri $releaseUri -Headers $headers -Method Get | Out-Null
              $releaseExists = $true
          } catch {
              $status = [int]$_.Exception.Response.StatusCode
              if ($status -ne 404) { throw }
          }
          if ($releaseExists) { throw 'Release v0.9.3 already exists; refusing to overwrite it.' }

      - name: Locate NuGet
        timeout-minutes: 5
        shell: powershell
        run: |
          $nuget = Get-Command nuget.exe -ErrorAction SilentlyContinue
          if (-not $nuget) {
              choco install nuget.commandline -y --no-progress
              if ($LASTEXITCODE -ne 0) { throw "Chocolatey NuGet install failed with exit code $LASTEXITCODE." }
          }

      - name: Ensure full WDK validation tools
        timeout-minutes: 15
        shell: powershell
        run: |
          $inf2cat = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10" -Filter Inf2Cat.exe -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $inf2cat) {
              $winget = Get-Command winget.exe -ErrorAction Stop
              & $winget.Source install --source winget --exact --id Microsoft.WindowsWDK.10.0.28000 --accept-package-agreements --accept-source-agreements --silent --disable-interactivity
              if ($LASTEXITCODE -ne 0) { throw "WDK WinGet installation failed with exit code $LASTEXITCODE." }
          }

      - name: Ensure NSIS
        timeout-minutes: 5
        shell: powershell
        run: |
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue) -and -not (Test-Path -LiteralPath (Join-Path $env:ProgramFiles 'NSIS\makensis.exe')) -and -not (Test-Path -LiteralPath (Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'))) {
              choco install nsis -y --no-progress
              if ($LASTEXITCODE -ne 0) { throw "Chocolatey NSIS install failed with exit code $LASTEXITCODE." }
          }

      - name: Build and verify installer
        timeout-minutes: 25
        shell: powershell
        run: |
          .\windows\Build-ExperimentalSetup.ps1 -SkipCodeAnalysis
          $setup = 'ExtFS-for-Windows-0.9.3-experimental-x64-setup.exe'
          if (-not (Test-Path -LiteralPath $setup)) { throw "Expected installer not produced: $setup" }
          $version = (Get-Item -LiteralPath $setup).VersionInfo.FileVersion
          if ($version -ne '0.9.3.0') { throw "Installer version mismatch: expected 0.9.3.0, found '$version'." }
          $driverVer = Get-Content -LiteralPath 'release\driver\extfs.inf' | Where-Object { $_ -match '^\s*DriverVer\s*=' } | Select-Object -First 1
          if (($driverVer -replace '\s', '') -ne 'DriverVer=08/20/2026,0.9.3.0') { throw "Staged INF version mismatch: '$driverVer'." }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $setup).Hash
          "EXTFS_SETUP_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Installer SHA-256: $hash"

      - name: Publish and verify GitHub Release v0.9.3
        timeout-minutes: 5
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = 'ExtFS-for-Windows-0.9.3-experimental-x64-setup.exe'
          $notes = @"
          ExtFS for Windows 0.9.3 is the Windows-lifecycle/Common-1.9 maintenance release on the 0.9.2 audit-hardened filesystem boundary.

          Changes in this release:
          - supplies the required FSRTL advanced FCB header for every Windows file object;
          - makes Memory Manager authoritative for mapped-section closure before FCB reclamation or removable-media refresh;
          - resynchronises removable-media read-only state;
          - pins and verifies driver/package metadata at 0.9.3.0;
          - bounds headless signature verification so packaging cannot hang indefinitely;
          - pins Infiltratr Common 1.9.0 at a65b279b40682791f2cfefb4d9bdc274790b0c77.

          This installer is development/test signed and remains experimental. Use it only on disposable/test Windows systems and backed-up test volumes.

          Installer SHA-256: $env:EXTFS_SETUP_SHA256
          "@
          Set-Content -LiteralPath release-notes.md -Value $notes -Encoding utf8
          & gh release create v0.9.3 $setup --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'ExtFS for Windows 0.9.3' --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw "GitHub release creation failed with exit code $LASTEXITCODE." }

          $release = & gh release view v0.9.3 --repo $env:GITHUB_REPOSITORY --json tagName,name,assets,isDraft,isPrerelease,targetCommitish | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $release.tagName -ne 'v0.9.3' -or $release.name -ne 'ExtFS for Windows 0.9.3' -or $release.isDraft -or $release.isPrerelease) { throw 'Published release metadata is incorrect.' }
          $assets = @($release.assets | Where-Object name -eq $setup)
          if ($assets.Count -ne 1) { throw "Expected exactly one installer asset '$setup'." }
          Write-Host "Published and verified v0.9.3 with $setup"

      - name: Clean obsolete publication branches
        if: success()
        timeout-minutes: 5
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          & gh pr close 5 --repo $env:GITHUB_REPOSITORY --comment 'Superseded by the validated ExtFS 0.9.3 recovery release.' *> $null
          foreach ($branch in @('forensic-fix-common19', 'release-093-fast-publish', 'release-093-observable', 'codex/extfs-093-recovery')) {
              & gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/git/refs/heads/$branch" *> $null
              if ($LASTEXITCODE -eq 0) { Write-Host "Deleted obsolete branch $branch" } else { Write-Host "Branch $branch already absent or retained by repository policy." }
          }
