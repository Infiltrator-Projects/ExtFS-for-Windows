# SPDX-License-Identifier: GPL-3.0-or-later
name: Apply 0.9.2 version normalization

on:
  push:
    branches:
      - hardening/v0.9.2
    paths:
      - tools/apply_092_versions.py
      - .github/workflows/apply-092-versions.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/v0.9.2
      - name: Normalize version metadata
        run: python3 tools/apply_092_versions.py
      - name: Portable build smoke test
        run: |
          make clean
          make all
          ./build/test-extfs
      - name: Commit normalized metadata and remove helper
        run: |
          rm tools/apply_092_versions.py
          rm .github/workflows/apply-092-versions.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Normalize ExtFS 0.9.2 version metadata"
          git push origin HEAD:hardening/v0.9.2
