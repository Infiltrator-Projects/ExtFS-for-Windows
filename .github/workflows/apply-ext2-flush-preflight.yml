# SPDX-License-Identifier: GPL-3.0-or-later
name: Apply ext2 flush preflight correction

on:
  push:
    branches:
      - hardening/v0.9.2
    paths:
      - tools/apply_ext2_flush_preflight.py
      - .github/workflows/apply-ext2-flush-preflight.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/v0.9.2
      - name: Apply targeted preflight patch
        run: python3 tools/apply_ext2_flush_preflight.py
      - name: Validate regression suite
        run: |
          make clean
          make all
          ./build/test-extfs
      - name: Remove one-time helper and commit
        run: |
          rm tools/apply_ext2_flush_preflight.py
          rm .github/workflows/apply-ext2-flush-preflight.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/extfs.c tests/test_extfs.c tools/apply_ext2_flush_preflight.py .github/workflows/apply-ext2-flush-preflight.yml
          git commit -m "Preflight ext2 durability support before mutation"
          git push origin HEAD:hardening/v0.9.2
